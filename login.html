<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CELESTIA Engagement Rings</title>
    <meta name="description" content="Sign in to your CELESTIA account to track custom engagement ring commissions and access certified diamond documentation.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>

<body class="auth-page">
    <!-- Top Right Utility: Theme Toggle -->
    <div class="auth-top-corner">
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
            <i class="bi bi-moon fs-5"></i>
        </button>
    </div>

    <!-- Auth Section -->
    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="auth-card">
                        <div class="text-center mb-4">
                            <a class="navbar-brand text-nowrap d-inline-flex align-items-center gap-2 mb-4 text-decoration-none"
                                href="index.html">
                                <img src="assets/images/logo-main.png" alt="Celestia Diamonds Logo" class="brand-logo-img">
                                <div class="d-flex flex-column justify-content-center text-start">
                                    <span class="brand-font" style="line-height: 1; letter-spacing: 2px;">CELESTIA</span>
                                    <span style="font-size: 0.62rem; letter-spacing: 2.2px; color: var(--accent-gold); font-weight: 600; text-transform: uppercase;">ENGAGEMENT RINGS</span>
                                </div>
                            </a>
                            <h3 class="brand-font">Login</h3>
                            <p class="text-secondary small">Access your account & orders</p>
                        </div>

                        <form action="index.html">
                            <div class="mb-3">
                                <label class="form-label small text-secondary">Email Address</label>
                                <input type="email" class="form-control" placeholder="client@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-secondary mb-0">Password</label>
                                <div class="input-group mt-2">
                                    <input type="password" class="form-control border-end-0" id="loginPassword"
                                        placeholder="••••••••" required>
                                    <span class="input-group-text bg-transparent text-secondary border-start-0"
                                        style="cursor: pointer;"
                                        onclick="const p = document.getElementById('loginPassword'); p.type = p.type === 'password' ? 'text' : 'password'; this.querySelector('i').classList.toggle('bi-eye'); this.querySelector('i').classList.toggle('bi-eye-slash');">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check mb-0">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label small text-secondary" for="rememberMe">Remember Me</label>
                                </div>
                                <a href="#" class="small text-gold text-decoration-none">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-gold w-100 py-2 mb-3">Login</button>

                            <div class="position-relative my-4">
                                <hr class="text-secondary" style="opacity: 0.2;">
                                <span
                                    class="position-absolute top-50 start-50 translate-middle px-3 small text-secondary"
                                    style="background-color: var(--surface-color, #fff);">Or sign in with</span>
                            </div>

                            <div class="d-flex gap-3 mb-4">
                                <button type="button"
                                    class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-google"></i> Google
                                </button>
                                <button type="button"
                                    class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-apple"></i> Apple
                                </button>
                            </div>

                            <div class="text-center">
                                <p class="small text-secondary mb-0">New Celestia client? <a href="register.html"
                                        class="text-gold text-decoration-none fw-bold">Create Private Account</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Back to Top Button -->
    <button id="back-to-top" class="back-to-top" aria-label="Back to top" type="button">
        <i class="bi bi-chevron-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
